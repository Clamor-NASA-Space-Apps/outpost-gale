[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="*.json"
exclude_filter="captures/*, build/*"
export_path="build/web/index.html"

[preset.0.options]

variant/extensions_support=false
html/custom_html_shell="res://web/shell.html"
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true

[preset.1]

name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="*.json"
exclude_filter="captures/*, build/*"
export_path="build/linux/outpost-gale.x86_64"

[preset.1.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

[preset.2]

name="Windows"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="*.json"
exclude_filter="captures/*, build/*"
export_path="build/windows/OutpostGale.exe"

[preset.2.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
application/modify_resources=false
application/product_name="Outpost Gale"

[preset.3]

name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="*.json"
exclude_filter="captures/*, build/*"
export_path="build/macos/OutpostGale-macos.zip"

[preset.3.options]

binary_format/architecture="universal"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=true
application/bundle_identifier="org.clamor.outpostgale"
application/short_version="1.0"
application/version="1"
display/high_res=true
codesign/codesign=1
notarization/notarization=0
