<!DOCTYPE html>
<!--
The splash picture, ui/splash.png (boot splash, web shell and the first cover), 1280 x 720:
  node ../../tools/capture-view.mjs . captures/h --views horizon --scale 1   (our own render)
  node ../../tools/html-to-png.mjs design/splash/splash.html ui/splash.png --selector "#card" --scale 1
The render is scaled up from its bottom-left corner so the HUD in its top-right (frame rate, settings gear) falls
outside the frame. Colours are DESIGN.md tokens (surface, on-surface, on-surface-variant); the title is the HUD's
display font, Exo 2 ExtraBold (ui/theme_builder.gd "Title"). No logos.
-->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Exo 2'; src: url('../../ui/fonts/Exo2-wght.ttf'); font-weight: 100 900; }
@font-face { font-family: 'Lexend'; src: url('../../ui/fonts/Lexend-latin-wght.woff2'); font-weight: 100 900; }
html, body { margin: 0; background: #160f0c; }
#card { position: relative; width: 1280px; height: 720px; overflow: hidden; }
#shot { position: absolute; left: 0; bottom: 0; width: 1498px; }
#shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(22, 15, 12, 0.72) 0%, rgba(22, 15, 12, 0.35) 30%, rgba(22, 15, 12, 0) 52%); }
h1 { position: absolute; top: 64px; left: 0; right: 0; margin: 0; text-align: center; font: 800 112px/1 'Exo 2', sans-serif;
  color: #f6ecdc; letter-spacing: 0.01em; text-shadow: 0 2px 18px rgba(22, 15, 12, 0.55); }
#team { position: absolute; right: 28px; bottom: 22px; font: 500 18px/1 'Lexend', sans-serif; color: #c9b8a2;
  text-shadow: 0 1px 6px rgba(22, 15, 12, 0.9); }
</style></head><body><div id="card">
<img id="shot" src="../../captures/h/horizon.png" alt="">
<div id="shade"></div>
<h1>Outpost Gale</h1>
<div id="team">Team Clamor</div>
</div></body></html>
